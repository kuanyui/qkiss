        - Add the missing build dependency on Qt6Concurrent to the RPM spec.
  - srcpkgname: "qkiss"
    maintainer: "kuanyui <azazabc123@gmail.com>"
    version: "0.9.0"
    date: "2026-10-11T20:00:00+08:00"
    deb:
      urgency: "medium"
    body:
      added:
        - First public release.