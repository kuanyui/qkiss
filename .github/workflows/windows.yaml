name: Qt6 Windows Build

on:
  push:
    branches: [ "master", "gh_actions" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Download the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Install required Python packages (jsonschema, pyyaml)
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      # Step 4: Install libarchive via vcpkg
      - name: Install libarchive
        run: |
          vcpkg install libarchive:x64-windows

      # Step 5: Ensure location of ImageMagick
      - name: Locate ImageMagick
        run: |
          $magickPath = Get-ChildItem "C:\Program Files\ImageMagick*" | Select-Object -First 1
          if ($magickPath) {
            echo "$($magickPath.FullName)" >> $GITHUB_PATH
            Write-Host "Found ImageMagick at $($imPath.FullName)"
          } else {
            Write-Error "ImageMagick not found!"
          }

      # Step 6: Download and Unzip External Binary Dependencies (LHA & unar)
      - name: Download & Extract External Binary Dependencies
        run: |
          mkdir C:\deps

          # Handle LHA
          curl -L -o C:\deps\lha.zip https://github.com/jca02266/lha/releases/download/release-20211125/lha-1.14i-ac20211125-x64.exe.zip
          powershell Expand-Archive -Path C:\deps\lha.zip -DestinationPath C:\deps

          # Handle unar
          curl -L -o C:\deps\unar.zip https://cdn.theunarchiver.com/downloads/unarWindows.zip
          powershell Expand-Archive -Path C:\deps\unar.zip -DestinationPath C:\deps

          # Add deps directory to system PATH
          echo "C:\deps" >> $GITHUB_PATH

      # Step 7: Install Qt 6
      - name: Install Qt
        uses: jurplel/install-qt-action@682f723bf2f6e4d0237d26e60f933331b64512a4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'

      # Step 8: Initialize MSVC Environment
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Step 9: Build with CMake (build to `build/``)
      - name: CMake Configure and Build
        run: |
          cmake -B build -G "Visual Studio 17 2022" `
            -DWIN_EXTERNAL_DEPS_DIR="C:/deps" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      # Step 10: Package with CPack (Bundle Qt DLLs and External Binaries)
      - name: Package with CPack
        working-directory: build
        run: |
          cpack -G NSIS -C Release


      # Step 11: Upload the entire Release folder
      # Default value of ${CPACK_PACKAGE_FILE_NAME} is
      # ${CPACK_PACKAGE_NAME}-${CPACK_PACKAGE_VERSION}-${CPACK_SYSTEM_NAME}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QKiSS-Windows-Installer
          path: build/QKiSS-*-win64.exe