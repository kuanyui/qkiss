name: Qt6 Windows Build

on:
  push:
    branches: [ "master", "gh_actions" ]
  pull_request:
    branches: [ "master" ]

# == About actions/cache ==============================================================
#
# - Each job is run in separate VM, each VM:
#    - Create new empty `${github.workspace}`
#    - Execute `actions/cache@v5`, our setting is `with: {path: P, key: K}`, it will:
#        - Use ${K} to query cache from Github Cache Service.
#        - If cache found on Github Cache Service, download the zip into `${github.workspace}/${P}`
# - If job is success, before finished, `actions/cache@v5` will upload the cache labeled with ${K} onto Github Cache Service.
#
# == About the value of `cache.with.path` ==============================================
#
# The value of `with.path` is:
#
# - When cache missed: the folder needed to be cached (surely, job must be finished successfully).
# - When cache hit:    the expected expanded (extracted) folder.
#
# - If specifying a FOLDER_NAME instead of ABS_PATH, it will be interpreted as
#   `{github.workspace}/{FOLDER_NAME}`. Convension is use FOLDER_NAME instead of ABS_PATH.


# Split `prepare-vcpkg-cache` as an independent job to make sure the cache is
# saved as soon as `vcpkg install` finished successfully, instead of unable to
# create cache until the whole workflow (containing only 1 job) successfully
# finished. (because `vcpkg is too fucking time-costing`).
jobs:
  prepare-vcpkg-cache:
    name: Run `vcpkg install` and cache the built binary ZIPs.
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_binary_cache
      # VCPKG_BINARY_SOURCES: clear; files,${{ github.workspace }}\vcpkg_binary_cache,readwrite
    steps:
      # Step 1: Download the source code
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Manually create a cache folder for `vcpkg` in `github.workspace`,
      #
      # `vcpkg install` will download source code and build each package into
      # zip (which contains include/, lib/, bin/, share/, debug/...etc), these
      # zip files will be cached in `VCPKG_DEFAULT_BINARY_CACHE`, then extract
      # to `REPO_ROOT/vcpkg_installed/`

      - name: Manually create an extra folder `vcpkg_binary_cache` as `VCPKG_DEFAULT_BINARY_CACHE`
        shell: bash
        run: mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

      # Step 2: [Cache] Try to restore `vcpkg_binary_cache` folder with specified key
      - name: Restore `vcpkg_binary_cache`
        uses: actions/cache@v5
        with:
          ### In "Manifest Mode" (when `vcpkg.json`` exists at repo root), vcpkg
          ### automatically installs all dependencies into `vcpkg_installed/`
          ### folder by default. So use this folder name as cache path.
          ## path: vcpkg_installed
          path: vcpkg_binary_cache
          key: ${{ runner.os }}-vcpkg-binary-cache-${{ hashFiles('vcpkg.json') }}

      # Step 3: Download & build & install packages via vcpkg
      - name: Download & build & install packages via vcpkg, and cache to `vcpkg_binary_cache`
        run: vcpkg install --triplet x64-windows

  prepare-icon-cache:
    name: Convert SVG icons into PNG and cache them.
    runs-on: windows-latest
    steps:
      # Step 1: Download the source code
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # PAT token defined in Repository secrets. SHould have read permission of this repo and all submodules
          token: ${{ secrets.MY_PAT }}
          submodules: 'recursive'

      # Step 2: Install Inkscape
      - name: Install Inkscape via Chocolatey
        run: |
          choco install inkscape --no-progress
          echo "C:\Program Files\Inkscape\bin" >> $env:GITHUB_PATH

      # Step 3: Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v6
        id: cpython311
        with:
          python-version: '3.11'

      # Step 4: Get icon submodule commit hash
      - name: Get submodule commit hash
        id: iconSubmodule
        run: |
          # Commit hash of submodule
          echo "commitHash=$(git -C resources/tango-icon-remixer rev-parse HEAD)" >> $GITHUB_OUTPUT
        shell: bash

      # Step 5: Restore cache
      - name: Cache generated icons
        uses: actions/cache@v5
        with:
          path: |
            generated/icon_theme__png
            generated/icon_theme__svg
            generated/icon_built.stamp
          key: ${{ runner.os }}-generatedicons-${{ hashFiles('resources/included_icons.txt') }}-${{ steps.iconSubmodule.outputs.commitHash }}

      # Step 6: Convert icons via CMake script mode (cmake -P <script_file>)
      - name: Convert icons via CMake script mode
        run: cmake `
                 -DTASK=GENERATE_ICONS `
                 -DWIN_PYTHON3_EXE="${{ steps.cpython311.outputs.python-path }}" `
                 -P CMakeLists.txt

  build-main:
    name: Build main project
    needs: [ 'prepare-vcpkg-cache', 'prepare-icon-cache' ]
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_binary_cache
    steps:
      # Step 1: Download the source code
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # PAT token defined in Repository secrets. SHould have read permission of this repo and all submodules
          token: ${{ secrets.MY_PAT }}
          submodules: 'recursive'

      # Step 2: Restore icon cache
      - name: Restore generated icons cache
        uses: actions/cache@v5
        with:
          path: |
            generated/icon_theme__png
            generated/icon_theme__svg
            generated/icon_built.stamp
          # key: ${{ runner.os }}-generatedicons-${{ hashFiles('resources/included_icons.txt') }}-${{ steps.iconSubmodule.outputs.commitHash }}
          key: ${{ runner.os }}-generatedicons-${{ hashFiles('resources/included_icons.txt') }}-${{ needs.prepare-icon-cache.outputs.commitHash }}

      # Step 3: [Cache] Try to restore `vcpkg_binary_cache` folder with specified key
      - name: Restore `vcpkg_binary_cache`
        uses: actions/cache@v5
        with:
          path: vcpkg_binary_cache
          key: ${{ runner.os }}-vcpkg-binary-cache-${{ hashFiles('vcpkg.json') }}

      # Step 4: Install packages via vcpkg (from cache)
      - name: Install packages via `vcpkg` from `vcpkg_binary_cache`
        run: vcpkg install --triplet x64-windows

      # Step 5: Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v6
        id: cpython311
        with:
          python-version: '3.11'

      # Step 6: Install required Python packages (jsonschema, pyyaml)
      - name: Install Python dependencies
        # use `python -m pip` instead of `pip` to ensure the runtime installed
        # by `actions/setup-python@v4` is chosen.
        run: python -m pip install jsonschema pyyaml

      # Step 7: Ensure location of ImageMagick (for converting .PNGs to .ICO)
      - name: Locate ImageMagick (for converting .PNGs to .ICO)
        run: |
          $magickPath = Get-ChildItem "C:\Program Files\ImageMagick*" | Select-Object -First 1
          if ($magickPath) {
            echo "$($magickPath.FullName)" >> $GITHUB_PATH
            Write-Host "Found ImageMagick at $($imPath.FullName)"
          } else {
            Write-Error "ImageMagick not found!"
          }

      # Step 8: [Cache] Download and extract external binary dependencies (LHA & unar)
      - name: Cache external binary dependencies
        id: cache-external-binary-dependencies
        uses: actions/cache@v5
        with:
          path: C:\bin_deps
          # (if need rebuild libarchive, increase this int.)
          key: ${{ runner.os }}-external-binary-dependencies-v1

      # Step 8.1: Download and extract external binary dependencies (LHA & unar)
      - name: Download & extract external binary dependencies
        if: steps.cache-external-binary-dependencies.outputs.cache-hit != 'true'
        run: |
          mkdir C:\bin_deps

          # Handle LHA
          curl -L -o C:\bin_deps\lha.zip https://github.com/jca02266/lha/releases/download/release-20211125/lha-1.14i-ac20211125-x64.exe.zip
          powershell Expand-Archive -Path C:\bin_deps\lha.zip -DestinationPath C:\bin_deps

          # Handle unar
          curl -L -o C:\bin_deps\unar.zip https://cdn.theunarchiver.com/downloads/unarWindows.zip
          powershell Expand-Archive -Path C:\bin_deps\unar.zip -DestinationPath C:\bin_deps

      # Step 8.2: Add external binary dependencies directory to system PATH
      - name: Add external dependencies to PATH
        run: echo "C:\bin_deps" >> $GITHUB_PATH

      # Step 9: Install Qt 6
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          target: 'desktop'         # Actually the default value is already `desktop`.
          modules: 'qtmultimedia'   # Important!
          cache: true      # [Cache] built-in cache

      # Step 10: Initialize MSVC Environment
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Step 11: Build with CMake (build to `build/`)
      - name: CMake Configure and Build
        # Explicitly specify `$env:pythonLocation` which is prepared by `actions/setup-python`,
        # to prevent CMake from choosing other version of python interpreters,
        #
        # `-DPython3_EXECUTABLE` may be overwritten by `find_package(Python3)`
        # Python + Windows is a pile of shit. Never understand how do they handle PATH.
        run: |
          # DIRTY WORKAROUND 1: Use PowerShell to raise the priority of `actions/setup-python` to top.
          $env:PATH = "$env:pythonLocation;$env:pythonLocation\Scripts;$env:PATH"

          # DIRTY WORKAROUND 2: Hijack envvar to force CMake to eat the python location
          $env:Python3_ROOT_DIR = "$env:pythonLocation"

          # DIRTY WORKAROUND 3: Lots of explicit -DPython3_ for Python this little shit:
          #
          #    -DPython3_ROOT_DIR="$env:pythonLocation" `
          #    -DPython3_EXECUTABLE="$env:pythonLocation\python.exe" `
          #    -DPython3_FIND_STRATEGY=LOCATION `
          #    -DPython3_FIND_REGISTRY=NEVER `
          #
          # But they are totally useless! Maybe be overwritten by vcpkg, msvc-dev-cmd, or something wtf.
          # So I defined a -DWIN_PYTHON3_EXE for fucking Windows.

          echo "[DEBUG][PowerShell env] env:pythonLocation: $env:pythonLocation"
          echo "[DEBUG][Github Context] env.pythonLocation: ${{ env.pythonLocation }}"
          echo "[DEBUG][Github Context] steps.cpython311: ${{ steps.cpython311.outputs.python-path }}"

          cmake -B build -G "Visual Studio 17 2022" `
            -DWIN_EXTERNAL_DEPS_DIR="C:/bin_deps" `
            -DWIN_PYTHON3_EXE="${{ steps.cpython311.outputs.python-path }}" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      # Step 12: Package with CPack (Bundle Qt DLLs and External Binaries)
      - name: Package with CPack
        working-directory: build
        run: |
          cpack -G NSIS -C Release


      # Step 13: Upload the entire Release folder
      # Default value of ${CPACK_PACKAGE_FILE_NAME} is
      # ${CPACK_PACKAGE_NAME}-${CPACK_PACKAGE_VERSION}-${CPACK_SYSTEM_NAME}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QKiSS-Windows-Installer
          path: build/qkiss-*-win64.exe