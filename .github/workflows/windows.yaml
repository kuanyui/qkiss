name: Qt6 Windows Build

on:
  push:
    branches: [ "master", "gh_actions" ]
    # Also run for a version tag, for example `v0.9.0`.
    # Then the last job, `upload-to-release`, puts the Windows files on the release page.
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# == About actions/cache ==============================================================
#
# - Each job is run in separate VM, each VM:
#    - Create new empty `${github.workspace}`
#    - Execute `actions/cache@v5`, our setting is `with: {path: P, key: K}`, it will:
#        - Use ${K} to query cache from Github Cache Service.
#        - If cache found on Github Cache Service, download the zip into `${github.workspace}/${P}`
# - If job is success, before finished, `actions/cache@v5` will upload the cache labeled with ${K} onto Github Cache Service.
#
# == About the value of `cache.with.path` ==============================================
#
# The value of `with.path` is:
#
# - When cache missed: the folder needed to be cached (surely, job must be finished successfully).
# - When cache hit:    the expected expanded (extracted) folder.
#
# - If specifying a FOLDER_NAME instead of ABS_PATH, it will be interpreted as
#   `{github.workspace}/{FOLDER_NAME}`. Convension is use FOLDER_NAME instead of ABS_PATH.


# Split `prepare-vcpkg-cache` as an independent job to make sure the cache is
# saved as soon as `vcpkg install` finished successfully, instead of unable to
# create cache until the whole workflow (containing only 1 job) successfully
# finished. (because `vcpkg is too fucking time-costing`).
jobs:
  prepare-vcpkg-cache:
    name: Run `vcpkg install` and cache the built binary ZIPs.
    runs-on: windows-latest
    outputs:
      msvcVer: ${{ steps.getMsvcVer.outputs.msvcVer }}
    env:
      # VCPKG_BINARY_SOURCES: clear; files,${{ github.workspace }}/vcpkg_cache,readwrite
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache/archives
      # also caches `VCPKG_DOWNLOADS` folder for `cmake` & `powershell` required by `vcpkg` itself.
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg_cache/downloads
      # VCPKG_FORCE_SYSTEM_BINARIES: 1     # Force to use system's `cmake` and `powershell-core` instead of download & installing vcpkg's one
    steps:
      # Step 1: Download the source code
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get MSVC Version (for creating key of cache of vcpkg)
        id: getMsvcVer
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvcVer = Get-Content "$vsPath\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw -ErrorAction SilentlyContinue
          $msvcVer = $msvcVer.Trim()
          Write-Host "Check Point -> Detected MSVC: [$msvcVer]"
          if (-not $msvcVer) {
            $msvcVer = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
            Write-Host "Warning: Falling back to VS Version: [$msvcVer]"
          }
          echo "msvcVer=$msvcVer" >> $env:GITHUB_OUTPUT

      # Step 2: Manually create a cache folder for `vcpkg` in `github.workspace`,
      #
      # `vcpkg install` will download source code and build each package into
      # zip (which contains include/, lib/, bin/, share/, debug/...etc), these
      # zip files will be cached in `VCPKG_DEFAULT_BINARY_CACHE`, then extract
      # to `REPO_ROOT/vcpkg_installed/`

      - name: Manually create an extra folder `vcpkg_cache` as `VCPKG_DEFAULT_BINARY_CACHE`
        shell: bash
        run: |
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"
          mkdir -p "${VCPKG_DOWNLOADS}"

      # Step 2: [Cache] Try to restore `vcpkg_cache` folder with specified key
      - name: Restore `vcpkg_cache`
        id: vcpkg_cache
        uses: actions/cache@v5
        with:
          ### In "Manifest Mode" (when `vcpkg.json`` exists at repo root), vcpkg
          ### automatically installs all dependencies into `vcpkg_installed/`
          ### folder by default. So use this folder name as cache path.
          ## path: vcpkg_installed
          path: vcpkg_cache
          key: ${{ runner.os }}-msvc-${{ steps.getMsvcVer.outputs.msvcVer }}-vcpkg-mega-cache-${{ hashFiles('vcpkg.json') }}

      # Step 3: Download & build & install packages via vcpkg
      - name: Download & build & install packages via vcpkg, and cache to `vcpkg_cache`
        if: steps.vcpkg_cache.outputs.cache-hit != 'true'
        run: vcpkg install --triplet x64-windows

  prepare-icon-cache:
    name: Convert SVG icons into PNG and cache them.
    runs-on: windows-latest
    # build-main needs the tango-remixer commit too, to build the same cache key.
    # So this job gives the commit to build-main as a job output.
    outputs:
      commitHash: ${{ steps.icon_submodule.outputs.commitHash }}
    steps:
      # Step 1: Download the source code
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # PAT token defined in Repository secrets. SHould have read permission of this repo and all submodules
          # token: ${{ secrets.MY_PAT }}
          submodules: 'recursive'

      # Step 2: Get icon submodule commit hash
      - name: Get submodule commit hash
        id: icon_submodule
        run: |
          # Commit hash of submodule
          echo "commitHash=$(git -C resources/tango-remixer rev-parse HEAD)" >> $GITHUB_OUTPUT
        shell: bash

      # Step 3: Restore cache
      - name: Cache generated icons
        id: icon_cache
        uses: actions/cache@v5
        with:
          path: |
            generated/icon_theme__png
            generated/icon_theme__svg
            generated/icons_built.stamp
          # The icons are generated again when either part of this key changes:
          # - The hash of `included_icons.txt`: which icons we use.
          # - The tango-remixer commit: which version of the script and of the icon themes
          #   generates the icons.
          # A saved cache never changes. Without the commit in the key, CI could keep using
          # icons that an older tango-remixer generated.
          key: ${{ runner.os }}-generatedicons-${{ hashFiles('resources/included_icons.txt') }}-${{ steps.icon_submodule.outputs.commitHash }}
          # key: ${{ runner.os }}-generatedicons-${{ hashFiles('resources/included_icons.txt') }}

      # Step 4: Install Inkscape
      - name: Install Inkscape via Chocolatey
        if: steps.icon_cache.outputs.cache-hit != 'true'
        run: |
          choco install inkscape --no-progress
          echo "C:/Program Files/Inkscape/bin" >> $env:GITHUB_PATH

      # Step 5: Set up Python 3.13
      - name: Set up Python
        if: steps.icon_cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        id: cpython313
        with:
          python-version: '3.13'

      # Step 6: Convert icons via CMake script mode (cmake -P <script_file>)
      - name: Convert icons via CMake script mode
        if: steps.icon_cache.outputs.cache-hit != 'true'
        run: cmake `
                 -DTASK=GENERATE_ICONS `
                 -DWIN_PYTHON3_EXE="${{ steps.cpython313.outputs.python-path }}" `
                 -P CMakeLists.txt

  prepare-external-bin-deps-cache:
    name: Download external executable binary (LHA, Unar) and cache
    runs-on: windows-latest
    steps:
      # Step 1: Prepare cache
      - name: Cache external binary dependencies
        id: cache-external-binary-dependencies
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/bin_deps
          key: ${{ runner.os }}-external-binary-dependencies-v1

      # Step 2: Download and extract external binary dependencies (LHA & unar)
      - name: Download & extract external binary dependencies
        if: steps.cache-external-binary-dependencies.outputs.cache-hit != 'true'
        run: |
          mkdir "${{ runner.temp }}/bin_deps"

          # Handle LHA
          curl -L -o "${{ runner.temp }}/bin_deps/lha.zip" https://github.com/jca02266/lha/releases/download/release-20211125/lha-1.14i-ac20211125-x64.exe.zip
          powershell Expand-Archive -Path "${{ runner.temp }}/bin_deps/lha.zip" -DestinationPath "${{ runner.temp }}/bin_deps"

          # Handle unar
          curl -L -o "${{ runner.temp }}/bin_deps/unar.zip" https://cdn.theunarchiver.com/downloads/unarWindows.zip
          powershell Expand-Archive -Path "${{ runner.temp }}/bin_deps/unar.zip" -DestinationPath "${{ runner.temp }}/bin_deps"

  build-main:
    name: Build main project
    needs:
      - 'prepare-vcpkg-cache'
      - 'prepare-icon-cache'
      - 'prepare-external-bin-deps-cache'
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache/archives
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg_cache/downloads
      # VCPKG_FORCE_SYSTEM_BINARIES: 1     # Force to use system's `cmake` and `powershell-core` instead of download & installing vcpkg's one

    steps:
      # Step 1: Download the source code
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # PAT token defined in Repository secrets. SHould have read permission of this repo and all submodules
          # token: ${{ secrets.MY_PAT }}
          submodules: 'recursive'

      # Step 2: [Cache] Restore icon cache
      - name: Restore generated icons cache
        uses: actions/cache@v5
        with:
          path: |
            generated/icon_theme__png
            generated/icon_theme__svg
            generated/icons_built.stamp
          # Must be the same key as in `prepare-icon-cache`.
          # The tango-remixer commit comes from the `outputs` of that job.
          # key: ${{ runner.os }}-generatedicons-${{ hashFiles('resources/included_icons.txt') }}-${{ steps.icon_submodule.outputs.commitHash }}
          key: ${{ runner.os }}-generatedicons-${{ hashFiles('resources/included_icons.txt') }}-${{ needs.prepare-icon-cache.outputs.commitHash }}
          # key: ${{ runner.os }}-generatedicons-${{ hashFiles('resources/included_icons.txt') }}


      - name: DEBUG - Inspect generated icons
        shell: pwsh
        run: |
          Write-Host "GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE"

          Write-Host "===== generated/ ====="
          Get-ChildItem "$env:GITHUB_WORKSPACE/generated" -Force -ErrorAction Continue

          Write-Host "===== CustomizedTango/16x16/apps ====="
          Get-ChildItem "$env:GITHUB_WORKSPACE/generated/icon_theme__png/CustomizedTango/16x16/apps" `
            -Force `
            -ErrorAction Continue

          $icon = "$env:GITHUB_WORKSPACE/generated/icon_theme__png/CustomizedTango/16x16/apps/qkiss.png"

          Write-Host "===== Expected icon ====="
          Write-Host $icon
          Write-Host "Exists: $(Test-Path $icon)"

          Write-Host "===== Search all qkiss.png ====="
          Get-ChildItem "$env:GITHUB_WORKSPACE" `
            -Filter "qkiss.png" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName

      # Step 3: [Cache] Try to restore `vcpkg_cache` folder with specified key
      - name: Restore `vcpkg_cache`
        uses: actions/cache@v5
        with:
          path: vcpkg_cache
          key: ${{ runner.os }}-msvc-${{ needs.prepare-vcpkg-cache.outputs.msvcVer }}-vcpkg-mega-cache-${{ hashFiles('vcpkg.json') }}

      # Step 4: [Cache] External binary dependencies (LHA & unar)
      - name: Restore cache of external binary dependencies
        id: cache-external-binary-dependencies
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/bin_deps
          key: ${{ runner.os }}-external-binary-dependencies-v1

      # Step 4.1: Add external binary dependencies directory to system PATH
      - name: Add external dependencies to PATH
        run: echo "${{ runner.temp }}/bin_deps" >> $GITHUB_PATH

      # Step 5: Install packages via vcpkg (from cache)
      - name: Install packages via `vcpkg` from `vcpkg_cache`
        run: vcpkg install --triplet x64-windows

      # Step 6: Install NSIS for pack installer (What CPack using actually is) `makensis.exe`
      - name: Install NSIS via Chocolatey
        run: |
          choco install nsis --no-progress --yes
          $nsis = "C:/Program Files (x86)/NSIS"
          if (Test-Path "$nsis/makensis.exe") {
              Write-Host "Found NSIS (makensis.exe) at $nsis/makensis.exe"
              Add-Content -Path $env:GITHUB_PATH -Value $nsis
          } else {
              Write-Error "Unable to find NSIS (makensis.exe)"
              exit 1
          }
      # Step 6.1: Install `Dependencies`, to replace `dumpbin` because it can only get the direct DLL, so useless.
      - name: Install `Dependencies` via Chocolaty (to replace useless `dumpbin` provided by MSVC)
        run: |
          choco install dependencies --no-progress --yes
          $rawPath = "${env:ProgramFiles}/Dependencies"
          $depDir = $rawPath.Replace('\', '/')
          if (Test-Path "$depDir/Dependencies.exe") {
              Write-Host "Found Dependencies.exe at $depDir"
              Add-Content -Path $env:GITHUB_PATH -Value $depDir
          } else {
              $shimDir = $env:ChocolateyInstall.Replace('\', '/') + "/bin"
              if (Test-Path "$shimDir/Dependencies.exe") {
                  Write-Host "Found Dependencies shim at $shimDir"
                  Add-Content -Path $env:GITHUB_PATH -Value $shimDir
              } else {
                  Write-Error "Unable to find Dependencies.exe"
                  exit 1
              }
          }

      # - name: Install `Dependencies` via WinGet (to replace useless `dumpbin` provided by MSVC).... But I found WinGet is a forked Dependencies, not by `lucasg`.
      #   run: |
      #     winget install --id lucasg.Dependencies --disable-interactivity --accept-source-agreements --accept-package-agreements
      #     # WinGet creates shortcuts into this path
      #     $wingetLinks = "$env:LOCALAPPDATA\Microsoft\WinGet\Links"
      #     $depExe = "$wingetLinks\Dependencies.exe"
      #     if (Test-Path $depExe) {
      #         Write-Host "Found Dependencies.exe at $depExe"
      #         echo "$wingetLinks" >> $env:GITHUB_PATH
      #     } else {
      #         $installPath = Get-ChildItem -Path "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Filter "Dependencies.exe" -Recurse | Select-Object -First 1
      #         if ($installPath) {
      #             $binDir = $installPath.DirectoryName
      #             Write-Host "Found Dependencies.exe in Packages: $binDir"
      #             echo "$binDir" >> $env:GITHUB_PATH
      #         } else {
      #             Write-Error "Failed to locate Dependencies.exe after winget install"
      #             exit 1
      #         }
      #     }

      # Step 7: Set up Python 3.13
      - name: Set up Python
        uses: actions/setup-python@v6
        id: cpython313
        with:
          python-version: '3.13'

      # Step 8: Install required Python packages (jsonschema, pyyaml)
      - name: Install Python dependencies
        # use `python -m pip` instead of `pip` to ensure the runtime installed
        # by `actions/setup-python@v4` is chosen.
        run: python -m pip install jsonschema pyyaml

      # Step 9: Ensure location of ImageMagick (for converting .PNGs to .ICO)
      - name: Locate ImageMagick (for converting .PNGs to .ICO)
        run: |
          $magickPath = Get-ChildItem "C:/Program Files/ImageMagick*" | Select-Object -First 1
          if ($magickPath) {
            echo "$($magickPath.FullName)" >> $GITHUB_PATH
            Write-Host "Found ImageMagick at $($imPath.FullName)"
          } else {
            Write-Error "ImageMagick not found!"
          }

      # Step 10: Install Qt 6
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Use this to see all Qt versions https://ddalcino.github.io/aqt-list-server/
          version: '6.9.3'    # >= 6.9.0 supports emoji on Windows, so don't use 6.8.3 even if it's LTS  https://www.qt.io/blog/emoji-in-qt-6.9
          arch: 'win64_msvc2022_64'
          target: 'desktop'         # Actually the default value is already `desktop`.
          modules: 'qtmultimedia'   # Important!
          cache: true      # [Cache] built-in cache

      # Step 11: Initialize MSVC Environment
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Step 12: Build with CMake (build to `build/`)
      - name: CMake Configure and Build
        # Explicitly specify `$env:pythonLocation` which is prepared by `actions/setup-python`,
        # to prevent CMake from choosing other version of python interpreters,
        #
        # `-DPython3_EXECUTABLE` may be overwritten by `find_package(Python3)`
        # Python + Windows is a pile of shit. Never understand how do they handle PATH.
        run: |
          # DIRTY WORKAROUND 1: Use PowerShell to raise the priority of `actions/setup-python` to top.
          $env:PATH = "$env:pythonLocation;$env:pythonLocation/Scripts;$env:PATH"

          # DIRTY WORKAROUND 2: Hijack envvar to force CMake to eat the python location
          $env:Python3_ROOT_DIR = "$env:pythonLocation"

          # DIRTY WORKAROUND 3: Lots of explicit -DPython3_ for Python this little shit:
          #
          #    -DPython3_ROOT_DIR="$env:pythonLocation" `
          #    -DPython3_EXECUTABLE="$env:pythonLocation/python.exe" `
          #    -DPython3_FIND_STRATEGY=LOCATION `
          #    -DPython3_FIND_REGISTRY=NEVER `
          #
          # But they are totally useless! Maybe be overwritten by vcpkg, msvc-dev-cmd, or something wtf.
          # So I defined a -DWIN_PYTHON3_EXE for fucking Windows.

          echo "[DEBUG][PowerShell env] env:pythonLocation: $env:pythonLocation"
          echo "[DEBUG][Github Context] env.pythonLocation: ${{ env.pythonLocation }}"
          echo "[DEBUG][Github Context] steps.cpython313: ${{ steps.cpython313.outputs.python-path }}"

          # Don't use "Visual Studio 17 2022" as generator, it always generate multiple configs (Release, Debug...) during configuration time.
          # This cause `qt_generate_deploy_app_script(OUTPUT_SCRIPT)` create a new filename containig MSVC-specific syntax `$<CONFIG>`.
          # Ninja is single-config, more determinable, follows `-DCMAKE_BUILD_TYPE=Release` and configure only for `Release`.

          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DWIN_EXTERNAL_BIN_DEPS_DIR="${{ runner.temp }}/bin_deps" `
            -DWIN_PYTHON3_EXE="${{ steps.cpython313.outputs.python-path }}" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release

      - name: List build directory (Windows)
        run: Get-ChildItem -Path . -Depth 2

      # Step 13: Package with CPack (Bundle Qt DLLs and External Binaries)
      - name: Package with CPack
        working-directory: build
        # Configuration: Release. Generators (NSIS, ZIP) are already defined in CMakeLists.txt so do NOT use `-G` to overwrite it
        run: |
          cpack -VV -C Release
          if ($LASTEXITCODE -ne 0) {
              Write-Host "CPack failed!"
              Write-Host "============================================"
              Write-Host "./_CPack_Packages/win64/NSIS/NSISOutput.log (last 100 lines)"
              Write-Host "============================================"
              Get-Content ./_CPack_Packages/win64/NSIS/NSISOutput.log -Tail 100
              Write-Host "============================================"
              Write-Host "./_CPack_Packages/win64/NSIS/project.nsi"
              Write-Host "============================================"
              Get-Content -Path "./_CPack_Packages/win64/NSIS/project.nsi" | ForEach-Object { "$($_.ReadCount): $_" }
              # Get-Content -Path "./_CPack_Packages/win64/NSIS/project.nsi"
              # Get-Content -Path "./_CPack_Packages/win64/NSIS/project.nsi" | ForEach-Object { "$($_.ReadCount): $_" } | Select-Object -Index (740..750)
              # Get-Content ./_CPack_Packages/win64/NSIS/project.nsi

              exit 1
          }
          Write-Host "============================================"
          Write-Host "./_CPack_Packages/win64/NSIS/project.nsi"
          Write-Host "============================================"
          Get-Content -Path "./_CPack_Packages/win64/NSIS/project.nsi"

      - name: List build directory (Windows)
        run: Get-ChildItem -Path build -Depth 1

      # Step 14: Upload the entire Release folder
      # Default value of ${CPACK_PACKAGE_FILE_NAME} is
      # ${CPACK_PACKAGE_NAME}-${CPACK_PACKAGE_VERSION}-${CPACK_SYSTEM_NAME}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QKiSS-Windows-Portable
          path: |
            build/qkiss-*-win64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QKiSS-Windows-Installer
          path: |
            build/qkiss-*-win64.exe

      # - name: Create public release page
      #   uses: softprops/action-gh-release@v2
      #   if: startsWith(github.ref, 'refs/tags/')
      #   with:
      #     body_path: ${{ github.workspace }}/generated/latest_changelog.md
      #     files: |
      #       build/qkiss-*-win64.exe
      #       build/qkiss-*-win64.zip
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # == Put the Windows files on the release page ========================================
  #
  # This job runs only for a version tag, for example `v0.9.0`.
  # For a push to a branch, or for a pull request, it is skipped.
  #
  # It uploads the two files that build-main made:
  # - the installer: `qkiss-0.9.0-win64.exe`
  # - the portable ZIP: `qkiss-0.9.0-win64.zip`
  #
  # Good to know:
  # - This is a small job of its own, so that only this job gets write permission.
  #   The build jobs above do not need it.
  # - `tarball-and-obs.yaml` puts the source tarball and the release notes on the same release page.
  #   It does not matter which workflow finishes first.
  # - A file with the same name is replaced. So running it again for the same tag is safe.
  upload-to-release:
    name: Upload the Windows files to the release page
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-main
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release page and to upload files to it.
      contents: write
    steps:
      # Step 1: Download the files that build-main uploaded (its two artifacts).
      - name: Download the Windows files
        uses: actions/download-artifact@v4
        with:
          pattern: QKiSS-Windows-*
          path: windows-files
          # Put the files of both artifacts into the same folder.
          merge-multiple: true

      # Step 2: Upload them to the release page of this tag.
      # If the release page does not exist yet, it is created.
      - name: Upload to the release page
        uses: softprops/action-gh-release@v3
        with:
          files: windows-files/*
          # Fail if there is no file to upload, instead of quietly uploading nothing.
          fail_on_unmatched_files: true