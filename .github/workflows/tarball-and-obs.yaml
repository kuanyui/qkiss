name: Tarball and OBS

# ============================================================================================
# What this workflow does
# ============================================================================================
#
#   git tag v0.9.1 && git push --tags
#            |
#            v
#   1. cmake -B build                 -> expands generated/{qkiss.spec,PKGBUILD,debian/}
#   2. dpkg-source -Zgzip -b          -> generated/qkiss_0.9.1.tar.gz
#   3. make obs-packaging             -> generated/obs/{qkiss.spec,PKGBUILD,qkiss.dsc,debian.tar.gz}
#   4. actions/attest                 -> attests the build provenance of the tarball (step 8)
#      gh release upload              -> uploads the tarball and these 4 packaging files to the
#                                        Github release page
#   5. curl .../trigger/runservice    -> tells OBS to download them
#   6. OBS downloads the 4 packaging files from the latest Github release, and the tarball from
#      the URL in `Source0:` of qkiss.spec. Then OBS builds.
#   7. This workflow waits until OBS has all 5 files. It does not wait for the builds: see
#      their results on the OBS package page.
#
# There is exactly ONE tarball. `.spec` (rpm), `PKGBUILD` (Arch), `.dsc` (deb) and humans
# downloading it from Github all consume that same file.
#
# `windows.yaml` puts the Windows installer and ZIP on the same release page.
#
# ============================================================================================
# How OBS gets the files
# ============================================================================================
#
# The only file that you put into the OBS package by hand is `_service`, a copy of
# `packaging/obs/_service`. `_service` tells OBS to download the files of the latest Github
# release. OBS does not check Github by itself, so this workflow tells OBS when to download.
#
# The release page of a version has 2 kinds of files:
#
#   qkiss_0.9.1.tar.gz    The source code. It is uploaded once, and never replaced.
#   qkiss.spec            The packaging files. They can be published again for the same
#   PKGBUILD              version, to fix the packaging. (See "Fix the packaging of a
#   qkiss.dsc             published version" below.)
#   debian.tar.gz
#
# `_service` downloads the packaging files from URLs that are the same for every version, so
# their names have no version number. OBS takes the tarball URL from `Source0:` in qkiss.spec.
# For Debian, OBS uses qkiss.dsc + debian.tar.gz instead of the `debian/` inside the tarball.
# (See `obs-packaging` in the Makefile.)
#
# When only the packaging changes, the packaging revision goes up, so that users get the fixed
# package as an update:
#
#   RPM      `Release:`. OBS raises it by itself.
#   Debian   The `+N` at the end of the version (like `0.9.1-1+3.1`). OBS raises it by itself.
#   Arch     `pkgrel`. This workflow raises it when it publishes the packaging files again.
#
# "Latest" means the newest release on Github. So OBS builds whichever release is the newest.
# That is why this workflow refuses to publish a version that is older than the latest release.
#
# ============================================================================================
# Required secret in the `obs` environment (Settings > Environments > obs)
# ============================================================================================
#
#   OBS_RUNSERVICE_TOKEN
#
# This token can do only one thing: tell OBS to download the files of this one package again.
# It cannot upload files. It also cannot change what OBS downloads, because `_service` decides
# that. So a leaked token can only make OBS download the same files again.
# "Prerequisite" below shows how to create the token.
#
# ATTENTION: do NOT put your openSUSE password here. On build.opensuse.org that password is
# your *whole* openSUSE identity (Bugzilla, wiki, forum...), because the API only offers HTTP
# Basic auth:
#
#     $ curl -i https://api.opensuse.org/source/home:kuanyui
#     HTTP/2 401
#     www-authenticate: Basic realm="Use your SUSE developer account"
#
# ============================================================================================
# Prerequisite (one time, by hand, with your own OBS account)
# ============================================================================================
#
# 1. Put `_service` into the OBS package. Run these commands in the root folder of this
#    repository:
#
#        osc checkout --output-dir /tmp/obs-qkiss home:kuanyui:stable qkiss
#        cp packaging/obs/_service /tmp/obs-qkiss/
#        cd /tmp/obs-qkiss
#        osc add _service
#        osc commit -m "Download the files from the latest Github release"
#
#    OBS runs `_service` when you commit it. Before the first release, the files are not
#    on the release page yet, so this first run fails. That is expected: the first tag run
#    uploads the files, and then tells OBS to run `_service` again.
#
#    `packaging/obs/_service` changes rarely. When it does, commit the new copy the same way.
#
# 2. Create the token. It works only for this one package:
#
#        osc token --create --operation runservice home:kuanyui:stable qkiss
#
#    Save the token string that this command prints as the secret OBS_RUNSERVICE_TOKEN.
#    To revoke the token later, `osc token` lists your tokens with their IDs.
#    Then run `osc token --delete <ID>`.
#
# ============================================================================================
# Test before you push a version tag
# ============================================================================================
#
# A broken packaging script should not cost a new version number. So test the scripts first:
#
# 1. Push master. This also runs `windows.yaml`, which tests the Windows build.
# 2. Actions tab > "Tarball and OBS" > "Run workflow" on master, with "Test only" checked.
#    It skips the publishing steps: it does not touch the release page or OBS.
#    It keeps the source package as an artifact of the run, for you to check.
#    It cannot test the build on OBS, because `_service` downloads the files only from a
#    published release.
# 3. When the Windows build and this test both pass, push the tag.
#
# Check the tarball in the artifact carefully. Once it is on the release page, it is never
# replaced, so a broken tarball can only be fixed with a new version.
#
# ============================================================================================
# If the tag run fails
# ============================================================================================
#
# If the run failed before it uploaded the tarball, nothing is published yet. Then you may keep
# the same version: fix the script on master, then move the tag to the fixed commit:
#
#     git tag -f v0.9.0
#     git push -f origin v0.9.0
#
# The moved tag starts this workflow and `windows.yaml` again.
# Each of them uploads its files again. The new files replace the old ones, because the
# names are the same.
# (This workflow never replaces a tarball. In this case there is no tarball yet, so it uploads
# the new one.)
# Move a tag only before you announce the release. After that, people may already have
# downloaded the old files.
#
# Once the tarball is on the release page, never move the tag. Instead:
# - A temporary error (like a network error): re-run the failed run in the Actions tab.
# - A broken packaging file, or a broken step of this workflow: see the next section.
#
# ============================================================================================
# Fix the packaging of a published version
# ============================================================================================
#
# 1. Fix the packaging file or this workflow on master, and push master.
# 2. Actions tab > "Tarball and OBS" > "Run workflow" on master, with "Test only" unchecked.
#
# This run publishes the 4 packaging files of the latest release again. It never replaces the
# tarball on the release page. It takes everything from the tag of that release, except these packaging inputs,
# which it takes from master:
#
#     packaging/qkiss.spec.in, packaging/PKGBUILD.in, packaging/debian/, packaging/obs/
#
# ============================================================================================

on:
  push:
    tags: ['v*']
  # Allow re-running it manually from the Actions tab (ex: after a transient OBS failure).
  # - "Test only" checked (the default): build and check, but publish nothing. See above.
  # - "Test only" unchecked: publish for real.
  #   Then choose the version tag in "Use workflow from".
  #   Or choose master, to publish the packaging files of the latest release again.
  #   (See "Fix the packaging of a published version" above.)
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test only: do not publish to OBS or to the release page'
        type: boolean
        default: true

permissions:
  # Needed to create/update the Github release page.
  contents: write
  # Needed by step 8 to attest the tarball: to get the identity of this run that signs the
  # attestation, and to store it on GitHub.
  id-token: write
  attestations: write

# Run only one run of this workflow at a time. Two runs that publish at the same time could
# upload different files to the same release page, or choose the same Arch `pkgrel`.
concurrency:
  group: publish-to-obs
  cancel-in-progress: false

env:
  OBS_APIURL: https://api.opensuse.org
  OBS_PROJECT: 'home:kuanyui:stable'
  OBS_PACKAGE: 'qkiss'
  # Step 6 writes the 4 packaging files into this folder (with `make obs-packaging`).
  # The folder is inside `generated/`, which the tarball leaves out.
  OBS_PACKAGING_DIR: 'generated/obs'

jobs:
  publish:
    name: Build the source package and push it to OBS
    runs-on: ubuntu-latest
    # OBS_RUNSERVICE_TOKEN is a secret of this environment.
    # Test runs on master use this environment too. So if you ever limit it to some branches
    # or tags (Settings > Environments > obs), allow master as well.
    environment: obs
    # openSUSE image, because Qt6/inkscape/dpkg are all one zypper away.
    container: opensuse/tumbleweed

    steps:
      # Step 1: Install everything.
      #
      # The `cmake(...)` capabilities are copied 1:1 from `packaging/qkiss.spec.in`'s
      # BuildRequires, so this list cannot silently drift away from the .spec.
      #
      # `dpkg` is the openSUSE package that ships `/usr/bin/dpkg-source`.
      # `curl` talks to Github and OBS.
      # `gh` (GitHub CLI) uploads to the Github release page (steps 8 and 9). The runner has `gh`
      # too, but this job runs in a container, which does not see it.
      # `git` must be installed BEFORE actions/checkout, otherwise checkout falls back to a
      # tarball download and submodules are silently skipped.
      - name: Install build & packaging dependencies
        run: |
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install --no-recommends \
            git tar gzip make cmake gcc-c++ \
            curl dpkg gh \
            inkscape desktop-file-utils \
            libarchive-devel \
            python3-jsonschema python3-PyYAML \
            'cmake(Qt6Core)' \
            'cmake(Qt6Gui)' \
            'cmake(Qt6Widgets)' \
            'cmake(Qt6Multimedia)' \
            'cmake(Qt6Concurrent)' \
            'cmake(Qt6OpenGL)' \
            'cmake(Qt6LinguistTools)'

      # Step 2: Let the Makefile's `git rev-parse` (-> gitversion.cmake) work in later steps.
      #
      # actions/checkout DOES add `safe.directory` itself, but only into a *temporary*
      # global config with an overridden HOME (see `configureTempGlobalConfig()` in
      # git-auth-helper.ts), so it does not carry over into our own steps. Without this,
      # `git rev-parse` would fail silently and gitversion.cmake would end up empty.
      #
      # NOTE: nothing here rewrites the `git@github.com:` submodule URLs -- `.gitmodules`
      # stays SSH and untouched. actions/checkout already writes
      # `url.https://github.com/.insteadOf git@github.com:` into the global config *before*
      # running `submodule update --recursive` (git-source-provider.ts:278 vs :284), which
      # covers tango-remixer's own nested submodules too.
      - name: Mark the workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      # Before step 3: decide what this run does, and for which tag.
      #
      #   test       "Test only" is checked. Build everything, but publish nothing.
      #   publish    A version tag: the pushed tag, or the tag chosen in "Use workflow from".
      #   republish  "Test only" is unchecked, on a branch. Publish the packaging files of the
      #              latest release again. (See "Fix the packaging of a published version".)
      - name: Decide what this run does
        id: target
        env:
          TEST_ONLY: ${{ inputs.test_only }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${TEST_ONLY}" = "true" ]; then
            echo "This run: test"
            echo "mode=test" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The tag of the latest release. 404 means that there is no release yet.
          status="$(curl --silent --show-error --output "${RUNNER_TEMP}/latest-release.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/latest")"
          case "${status}" in
            200) latest="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["tag_name"])' "${RUNNER_TEMP}/latest-release.json")" ;;
            404) latest="" ;;
            *)   echo "::error::Github answered HTTP ${status} for the latest release."
                 exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            mode=publish
            tag="${GITHUB_REF_NAME}"
            # OBS builds only the latest release. Stop before uploading anything if this tag is
            # older, because a newly published release becomes the latest one on Github.
            newest="$(printf '%s\n%s\n' "${latest#v}" "${tag#v}" | sort -V | tail -n 1)"
            if [ -n "${latest}" ] && [ "${newest}" != "${tag#v}" ]; then
              echo "::error::${tag} is older than the latest release ${latest}. OBS builds only the latest release."
              exit 1
            fi
          else
            mode=republish
            tag="${latest}"
            if [ -z "${tag}" ]; then
              echo "::error::There is no release yet, so there is nothing to publish again."
              exit 1
            fi
          fi
          echo "This run: ${mode} ${tag}"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Step 3: Download the source code (+ all nested submodules)
      # A "republish" run downloads the tag of the latest release, not the branch it runs on.
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.mode == 'republish' && steps.target.outputs.tag || '' }}
          submodules: 'recursive'

      # Step 4: [Cache] Icon generation runs at *configure* time (CMakeLists.txt), and it is
      # by far the slowest part of `cmake -B`. Same cache shape as `windows.yaml`.
      #
      # NOTE: `generated/` is excluded from the tarball, so nothing restored here can leak
      # into the released source package.
      - name: Get the tango-remixer commit
        id: icon_submodule
        run: echo "commitHash=$(git -C resources/tango-remixer rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache generated icons
        uses: actions/cache@v5
        with:
          path: |
            generated/icon_theme__png
            generated/icon_theme__svg
            generated/icons_built.stamp
          # Built like the key in `windows.yaml`: the icons are generated again when the icon
          # list or the tango-remixer commit changes.
          key: ${{ runner.os }}-generatedicons-${{ hashFiles('resources/included_icons.txt') }}-${{ steps.icon_submodule.outputs.commitHash }}

      # Step 5: Get the tarball.
      #
      # A publishing run never rebuilds or replaces a tarball that is already on the release
      # page, because people may already have downloaded it. So when the release page already
      # has the tarball, this step downloads it, and the later steps use exactly that file.
      # This step also saves the names of the files on the release page into
      # generated/release-assets.txt, for step 7.
      - name: Get the tarball
        id: tarball
        env:
          MODE: ${{ steps.target.outputs.mode }}
          TAG: ${{ steps.target.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(cat VERSION)"
          tarball="qkiss_${version}.tar.gz"
          mkdir -p generated
          : > generated/release-assets.txt
          if [ "${MODE}" != "test" ]; then
            if [ "${TAG}" != "v${version}" ]; then
              echo "::error::The tag ${TAG} does not match the VERSION file (${version})."
              exit 1
            fi
            # 404 means that the release page does not exist yet.
            status="$(curl --silent --show-error --output generated/release.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
            if [ "${status}" = "200" ]; then
              python3 -c 'import json, sys; print("\n".join(asset["name"] for asset in json.load(open(sys.argv[1]))["assets"]))' \
                generated/release.json > generated/release-assets.txt
            elif [ "${status}" != "404" ]; then
              echo "::error::Github answered HTTP ${status} for the release ${TAG}."
              exit 1
            fi
          fi
          if grep -qxF "${tarball}" generated/release-assets.txt; then
            echo "The release page already has ${tarball}. Download it, and do not build it."
            curl --fail --silent --show-error --location --output "generated/${tarball}" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${tarball}"
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif [ "${MODE}" = "republish" ]; then
            echo "::error::The release ${TAG} has no ${tarball}, so there is nothing to publish again."
            exit 1
          else
            make release-tarball
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "file=generated/${tarball}" >> "$GITHUB_OUTPUT"

      # Step 6: Write the 4 packaging files into OBS_PACKAGING_DIR (see `obs-packaging` in the
      # Makefile). This does not build the tarball.
      #
      # A "republish" run first replaces the packaging inputs of the tag with the ones of the
      # branch that it runs on. So it publishes your fix, while everything else stays as in
      # the tag.
      - name: Write the packaging files
        env:
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          if [ "${MODE}" = "republish" ]; then
            git fetch --quiet --depth=1 origin "${GITHUB_SHA}"
            git restore --source="${GITHUB_SHA}" --worktree -- \
              packaging/qkiss.spec.in packaging/PKGBUILD.in packaging/debian packaging/obs
            git status --short -- packaging
          fi
          make obs-packaging OBS_PACKAGING_DIR="${OBS_PACKAGING_DIR}"
          ls -l "${OBS_PACKAGING_DIR}"

      # Step 7: Raise the Arch `pkgrel` if needed, and check that all 5 files are for the
      # version in the VERSION file.
      #
      # OBS raises the packaging revision of RPM and Debian by itself, but not the `pkgrel` of
      # Arch. So when the release page already has a PKGBUILD of the same version, the new
      # PKGBUILD gets its `pkgrel` + 1. Otherwise `pkgrel` stays as in `packaging/PKGBUILD.in`.
      - name: Set the Arch pkgrel, and check the versions
        env:
          TAG: ${{ steps.target.outputs.tag }}
          TARBALL_FILE: ${{ steps.tarball.outputs.file }}
        run: |
          version="$(cat VERSION)"
          if grep -qxF PKGBUILD generated/release-assets.txt; then
            curl --fail --silent --show-error --location --output generated/published-PKGBUILD \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/PKGBUILD"
            if grep -qxF "pkgver=${version}" generated/published-PKGBUILD; then
              pkgrel="$(sed -n 's/^pkgrel=//p' generated/published-PKGBUILD)"
              case "${pkgrel}" in
                ''|*[!0-9]*)
                  echo "::error::The PKGBUILD on the release page has an unexpected pkgrel: '${pkgrel}'"
                  exit 1 ;;
              esac
              sed -i "s/^pkgrel=.*/pkgrel=$((pkgrel + 1))/" "${OBS_PACKAGING_DIR}/PKGBUILD"
            fi
          fi
          grep -H '^pkgrel=' "${OBS_PACKAGING_DIR}/PKGBUILD"
          # Every file must name the same version and the same tarball. A mismatch means that
          # the packaging inputs do not fit this release.
          tarball="$(basename "${TARBALL_FILE}")"
          spec_version="$(sed -n 's/^Version:[[:space:]]*//p' "${OBS_PACKAGING_DIR}/qkiss.spec")"
          # The file name at the end of the Source0 URL.
          spec_source0="$(sed -n 's/^Source0:[[:space:]]*//p' "${OBS_PACKAGING_DIR}/qkiss.spec" | sed 's|.*/||')"
          failed=0
          test -f "${TARBALL_FILE}" || { echo "::error::Missing ${TARBALL_FILE}"; failed=1; }
          [ "${spec_version}" = "${version}" ] || { echo "::error::qkiss.spec is not for ${version}"; failed=1; }
          [ "${spec_source0}" = "${tarball}" ] || { echo "::error::Source0 of qkiss.spec is not ${tarball}"; failed=1; }
          grep -qxF "pkgver=${version}" "${OBS_PACKAGING_DIR}/PKGBUILD" || { echo "::error::PKGBUILD is not for ${version}"; failed=1; }
          grep -qxF "source=(\"${tarball}\")" "${OBS_PACKAGING_DIR}/PKGBUILD" || { echo "::error::source of PKGBUILD is not ${tarball}"; failed=1; }
          grep -qxF "Version: ${version}" "${OBS_PACKAGING_DIR}/qkiss.dsc" || { echo "::error::qkiss.dsc is not for ${version}"; failed=1; }
          grep -qxF "DEBTRANSFORM-TAR: ${tarball}" "${OBS_PACKAGING_DIR}/qkiss.dsc" || { echo "::error::DEBTRANSFORM-TAR of qkiss.dsc is not ${tarball}"; failed=1; }
          grep -qxF "DEBTRANSFORM-FILES-TAR: debian.tar.gz" "${OBS_PACKAGING_DIR}/qkiss.dsc" || { echo "::error::DEBTRANSFORM-FILES-TAR of qkiss.dsc is not debian.tar.gz"; failed=1; }
          exit "${failed}"

      # Test only: keep the 5 files as an artifact of this run: the tarball, and the 4
      # packaging files that the release page would get.
      # Download them from the summary page of the run, and check them.
      - name: Keep the source package for checking (test only)
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: |
            ${{ steps.tarball.outputs.file }}
            ${{ env.OBS_PACKAGING_DIR }}/
          if-no-files-found: error
          # The tarball is big (about 142 MB), so delete it after a week.
          retention-days: 7

      # Step 8: Attest the build provenance of the tarball, then upload it to the Github release
      # page, only when step 5 built it in this run.
      #
      # The attestation (GitHub artifact attestations) is a statement that this workflow built
      # this exact tarball (by its SHA-256), from this commit. It is signed through Sigstore, with
      # a certificate that lives for a few minutes, so there is no key to keep anywhere. Anyone
      # can check a downloaded tarball with the GitHub CLI:
      #   gh attestation verify qkiss_0.9.1.tar.gz -R kuanyui/qkiss
      - name: Attest the build provenance of the tarball
        if: steps.target.outputs.mode == 'publish' && steps.tarball.outputs.new == 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.tarball.outputs.file }}

      # If the release page does not exist yet, this step creates it. `windows.yaml` may create it at
      # the same moment: then `gh release create` fails here, and the second `gh release view` finds
      # the page that the other workflow made. `--verify-tag`: without it, a missing tag would be
      # created from the default branch.
      # `gh release upload` without `--clobber` is a second safety: it fails when the release page
      # already has a file with the same name, so an existing tarball is never replaced.
      - name: Upload the tarball to the Github release page
        if: steps.target.outputs.mode == 'publish' && steps.tarball.outputs.new == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          TARBALL_FILE: ${{ steps.tarball.outputs.file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${TAG}" > /dev/null 2>&1 ||
            gh release create "${TAG}" --verify-tag --title "${TAG}" ||
            { sleep 10; gh release view "${TAG}" > /dev/null; }
          gh release upload "${TAG}" "${TARBALL_FILE}"

      # Step 9: Write the release notes on the Github release page, and upload the 4 packaging files
      # to it. `--clobber`: they replace the packaging files of an earlier run.
      # The release page exists here: step 8 created it, or step 5 found the tarball on it.
      # OBS downloads the files from this page, so step 9 must come before step 10.
      - name: Upload the packaging files to the Github release page
        if: steps.target.outputs.mode != 'test'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${TAG}" --notes-file generated/latest_changelog.md
          gh release upload "${TAG}" "${OBS_PACKAGING_DIR}"/* --clobber

      # Step 10: Tell OBS to run `_service`. `_service` downloads the files from the latest
      # release. OBS answers before the download is done, so step 11 waits for the download.
      #
      # OBS builds only the latest release. So stop here if this release is not the latest
      # one, instead of waiting in step 11 for files that never come.
      - name: Tell OBS to run _service
        if: steps.target.outputs.mode != 'test'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          OBS_RUNSERVICE_TOKEN: ${{ secrets.OBS_RUNSERVICE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')"
          if [ "${latest}" != "${TAG}" ]; then
            echo "::error::OBS builds only the latest release, which is ${latest}, not ${TAG}."
            exit 1
          fi
          if [ -z "${OBS_RUNSERVICE_TOKEN}" ]; then
            echo "::error::The secret OBS_RUNSERVICE_TOKEN is missing (Settings > Environments > obs)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Token ${OBS_RUNSERVICE_TOKEN}" \
            "${OBS_APIURL}/trigger/runservice"

      # Step 11: Wait until OBS lists all 5 files of this run. If they do not show up within
      # about 20 minutes, this step fails.
      #
      # OBS shows the file list of a package under `/public/`, without login. With `expand=1`,
      # the list also has the files that `_service` downloaded, with the MD5 checksum of each.
      # When the list has every file with the same MD5 checksum as ours, OBS has downloaded the
      # files of this run. Checking only the tarball is not enough: when only the packaging is
      # published again, the tarball is the same as before.
      # If `_service` fails, look at the OBS package page for the error.
      - name: Wait until OBS has the new files
        if: steps.target.outputs.mode != 'test'
        env:
          TARBALL_FILE: ${{ steps.tarball.outputs.file }}
        run: |
          # One line per file, like: qkiss.spec" md5="0123456789abcdef0123456789abcdef"
          # OBS adds a prefix to the names of the files that `_service` downloaded, for example
          # `_service:download_url:`. So only the end of each name is compared.
          for file in "${TARBALL_FILE}" "${OBS_PACKAGING_DIR}"/*; do
            printf '%s" md5="%s"\n' "$(basename "${file}")" "$(md5sum "${file}" | cut -d ' ' -f 1)"
          done > generated/obs-expected.txt
          cat generated/obs-expected.txt
          # 60 checks, 20 seconds apart: about 20 minutes in total.
          for attempt in $(seq 60); do
            sleep 20
            curl --fail --silent --show-error --output generated/obs-files.xml \
              "${OBS_APIURL}/public/source/${OBS_PROJECT}/${OBS_PACKAGE}?expand=1" || continue
            missing=0
            while IFS= read -r expected; do
              grep -qF -- "${expected}" generated/obs-files.xml || missing=1
            done < generated/obs-expected.txt
            if [ "${missing}" = 0 ]; then
              echo "OBS has all the files of this run."
              exit 0
            fi
          done
          echo "::error::After 20 minutes, OBS still does not have all the files of this run. See https://build.opensuse.org/package/show/${OBS_PROJECT}/${OBS_PACKAGE}"
          exit 1
