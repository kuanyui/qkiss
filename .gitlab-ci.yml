# Publish the website (homepage/) on GitLab Pages: https://kuanyui.gitlab.io/qkiss/
# (.github/workflows/homepage.yaml does the same on GitHub Pages; see homepage/README.md)
# The screenshot images are never committed here: they are cloned from the `screenshots/` folder of this project's wiki at build time (`homepage/screenshots.json` lists them).
homepage:
  stage: deploy
  image: python:3.13
  variables:
    GIT_SUBMODULE_STRATEGY: none   # the website needs no submodule (and the runner cannot clone the git@github.com: URLs of .gitmodules)
    # The wiki of this project, unless the CI/CD variable `SCREENSHOTS_REPO`
    # (Settings > CI/CD > Variables) says otherwise.
    SCREENSHOTS_REPO: "$CI_PROJECT_URL.wiki.git"
  script:
    - git clone --depth 1 "$SCREENSHOTS_REPO" /tmp/wiki
    - python3 homepage/build.py public --screenshots /tmp/wiki/screenshots
  # Deploy `public/` to GitLab Pages. (The `pages` keyword; naming the job `pages` instead is deprecated.)
  pages: true
  artifacts:
    paths:
      - public
  rules:
    # On the default branch, when something homepage/build.py reads has changed. A pipeline run by hand
    # (Build > Pipelines > Run pipeline, e.g. after replacing a screenshot image) has no push to compare
    # with, so it always runs this job.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - homepage/**/*
        - resources/appicon/**/*
        - resources/flags/**/*
        - .gitlab-ci.yml
