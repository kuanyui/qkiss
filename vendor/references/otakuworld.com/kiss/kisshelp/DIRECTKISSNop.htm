    <h2>nop()</h2>
    <div class="indent">
		<div>First defined in: FKiSS1</div>
		<div>The <b>nop</b> action does nothing.  It can be used as a placeholder in an event that
		may not have any actions in it.</div>

		<h4>Example:</h4>
    <div class="example">;@ nop()</div>
